[workspace]
resolver = "3"
members = [
    "crates/titan-agent-core",
    "crates/titan-agentd",
    "crates/titan-agent",
    "crates/titan-team",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
titan-agent-core = { path = "crates/titan-agent-core" }
# Protocol and CLI JSON (ADR-0007).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.22.1"
# PTY and terminal emulation from the official Alacritty project, not Zed's
# fork (ADR-0008). Zed's terminal crates are GPL: nothing is copied from them.
alacritty_terminal = { version = "0.26.0", default-features = false }
# GPUI from Zed's repository, pinned to the commit of the stable tag v1.28.1.
# Why and how to update it: docs/Decisiones/ADR-0006.
gpui = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }

[workspace.lints.rust]
unsafe_code = "deny"
