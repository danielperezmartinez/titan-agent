[workspace]
resolver = "3"
members = [
    "crates/titan-agent-core",
    "crates/titan-agentd",
    "crates/titan-agent",
    "crates/titan-team",
]

[workspace.package]
version = "0.5.2"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
titan-agent-core = { path = "crates/titan-agent-core" }
alacritty_terminal = "0.26.0"
base64 = "0.22.1"
futures = "0.3.34"
portable-pty = "0.9.0"
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.2.1", features = ["preserve_order"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# GPUI from Zed's repository, pinned to the commit of the stable tag v1.28.1.
# Why and how to update it: docs/Decisiones/ADR-0006.
gpui = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }

[workspace.lints.rust]
unsafe_code = "deny"
