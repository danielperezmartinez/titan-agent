[workspace]
resolver = "3"
members = [
    "crates/titan-agent-core",
    "crates/titan-agentd",
    "crates/titan-agent",
    "crates/titan-team",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
titan-agent-core = { path = "crates/titan-agent-core" }
# GPUI from Zed's repository, pinned to the commit of the stable tag v1.28.1.
# Why and how to update it: docs/Decisiones/ADR-0006.
gpui = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# Phase 1: protocol, terminals and the daemon. Why: docs/Decisiones/ADR-0007 and ADR-0008.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
alacritty_terminal = "0.26"
rustix = { version = "1", features = ["fs", "process"] }
signal-hook = "0.4"
futures = { version = "0.3", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
