# Composición del equipo de titan-agent. La leen titan-team (bin/team) y la skill "equipo".
# Formato v1 y códigos de error: docs/Decisiones/ADR-0010. Compruébalo con `bin/team check`.
# Para cambiar quién hace qué, edita este fichero: no hay nada fijo en el código.
# Origen: prototipo de la sandbox multiagente, adaptado en la fase 0
# (docs/Tareas/Fase 0 - Preparar el workspace y el equipo del prototipo.md).
version = 1
name = "titan-agent"

# Dónde guarda titan-team el estado de cada encargo (thread_id, turnos, salidas).
# Incluye events.jsonl de cada encargo, que lee titan-agentd para el monitor.
# No se versiona: las salidas pueden contener datos del entorno.
state_dir = ".agents/state"

[project]
repo = "."                         # este mismo repo
base = "main"                      # rama de la que sale cada encargo
worktrees_dir = ".agents/worktrees" # un worktree por encargo (no se versiona)
branch_prefix = "encargo/"
test_cmd = "cargo test --workspace"
# Desde el equipo v5: formato y compuerta que titan-team ejecuta por los roles
# (checks tras su turno y ask --gate para el revisor, que no puede ejecutar nada).
fmt_cmd = "cargo fmt --all"
gate_cmd = "cargo fmt --all --check && cargo clippy --workspace --all-targets --quiet -- -D warnings && cargo test --workspace --quiet"
# Desde el equipo v7: compila todo, tests incluidos, sin ejecutarlos (comprobación
# "build"). Los tests de Sol fallan sin implementación, pero deben compilar.
build_cmd = "cargo test --workspace --no-run --quiet"
test_timeout_s = 1800               # el primer build de GPUI en un worktree nuevo tarda
# Carpeta de compilación del equipo (relativa a este checkout, que es el del
# director): la comparten los checks, la compuerta y los roles que escriben de
# todos sus encargos, como CARGO_TARGET_DIR. Otro checkout (otro equipo en
# paralelo) tiene la suya, y el director compila en su propio target/.
target_dir = ".agents/target"
autocommit = true                  # titan-team hace commit tras cada turno que escribe
# Lo que no se copia al worktree de cada encargo (sparse checkout; sigue en la
# rama). Los roles trabajan solo con su prompt y el encargo: sin los punteros de
# arranque ni la bóveda, que son del director.
hidden_paths = ["/AGENTS.md", "/CLAUDE.md", "/GEMINI.md", "/docs/", "/.claude/"]

# Opciones de `codex exec` para todas las llamadas (cada una va como -c). Un rol
# puede añadir las suyas con su propia lista `config`.
[codex]
config = [
  "project_doc_max_bytes=0",           # no carga AGENTS.md (ni otros ficheros de proyecto)
  "project_doc_fallback_filenames=[]",
  "skills.include_instructions=false", # sin el catálogo de skills del usuario (~5k tokens)
]

[flow]
# Equipo v7 (2026-11-18; v6 del mismo día, v5 del 2026-11-17, v4 del 2026-11-16,
# v3 del 2026-11-15): se reparte por contexto, no por rol. La v7 corrige las
# carencias de la v6 (docs/Tareas/Equipo v7.md): sin cambios de reparto; Sol
# trabaja sobre un esqueleto que compila y su turno falla si sus tests no compilan.
# Opus (director) fija el contrato en la especificación e implementa cada parte
# con sus propios tests; Codex solo escribe antes los tests de aceptación (desde
# el contrato, sin inventar detalles) y hace UNA revisión al final con contexto
# limpio. Ver la skill "equipo".
steps = ["disenador_tests", "revisor"]  # entre los dos, implementa el director
review_role = "revisor"            # su informe lo decide el director
fix_role = "director"              # quien corrige es el director, no Codex
max_review_rounds = 1              # una sola ronda; más solo con permiso del usuario

[roles.director]
cli = "claude"                     # la sesión actual de Claude Code; titan-team no la lanza
model = "opus"
launch = false
purpose = "Diseña, implementa cada parte con sus tests, decide qué hallazgos acepta y lanza el evaluador visual."

# Los tests de aceptación viven en las carpetas tests/ de cada crate (tests de
# integración de Cargo). Las rutas admiten comodines (fnmatch); una ruta que
# termina en "/" cubre todo lo que hay debajo.
[roles.disenador_tests]
cli = "codex"
model = "gpt-6.1-sol"              # decisión del usuario (2026-11-14): otro modelo que el implementador
effort = "medium"                  # gasta cuota de Sol, como el revisor
sandbox = "workspace-write"
prompt_file = ".agents/prompts/disenador_tests.md"
allowed_paths = ["crates/*/tests/"] # aviso si toca algo fuera de aquí
# Tras su turno: formato (entra en su commit), compilación y tests. Sus tests
# fallan hasta que haya implementación (la salida de "test" es informativa),
# pero compilan contra el esqueleto del director: si no compilan (un lint
# denegado incluido), el turno sale en rojo (equipo v7).
checks = ["fmt", "build", "test"]
checks_required = ["build"]
# El encargo trae estas secciones antes de su primer turno, o titan-team no lo
# lanza: los criterios visuales se escriben antes de implementar (equipo v7).
brief_sections = ["Contrato", "Firmas", "Criterios visuales"]
timeout_s = 1200
purpose = "Antes de implementar, escribe POCOS tests de aceptación a partir de la especificación. El director no puede tocarlos."

# Luna solo para ediciones repetitivas con un patrón fijado en muchos sitios, o
# investigar una API en paralelo. Nunca la interfaz ni decisiones de diseño, ni
# movimientos puros de código (los hace el director con scripts/mover-lineas.sh).
# No está en el flujo: el director la llama cuando le sirve.
[roles.mecanico]
cli = "codex"
model = "gpt-6-luna"
effort = "medium"
sandbox = "workspace-write"
prompt_file = ".agents/prompts/mecanico.md"
forbidden_paths = ["crates/*/tests/", "docs/", "crates/titan-agent/"] # aviso: tests, bóveda o interfaz
# (si el encargo autoriza una de esas rutas: ask --allow <patrón>)
# Su turno pasa la compuerta o cuenta como fallido (no entregar sin compilar).
checks = ["fmt", "gate"]
checks_required = true
timeout_s = 1800
purpose = "Trabajo mecánico sin criterio que le encarga el director; nunca la interfaz."

[roles.revisor]
cli = "codex"
model = "gpt-6.1-sol"
effort = "high"                    # decisión del usuario (2026-11-14)
sandbox = "read-only"
prompt_file = ".agents/prompts/revisor.md"
output_schema = ".agents/schemas/review.json"
timeout_s = 900
purpose = "Una revisión al final, en un hilo nuevo (contexto limpio): la especificación, el diff y la compuerta (ask --gate). Informa; decide el director."
