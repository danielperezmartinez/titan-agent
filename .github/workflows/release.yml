# Publish version: build, sign, and publish a titan-agent version on
# GitHub Releases (docs/Decisiones/ADR-0011, §1–§3; docs/README.md,
# Publication). Manually triggered on main only, with user authorization
# for that version: gh workflow run release.yml --ref main
# - Prepare: the Cargo.toml version is 0.x.y, its tag does not exist, and the
#   commit's Cambios, Verificar, and Fugas checks have passed. If they are
#   still running (the workflow was launched right after merging), it waits
#   for them (40 min at most) instead of failing.
# - Linux and Windows: build in release mode and package.
# - Publish (environment `release`, the only one with signing secrets):
#   manifest signed with minisign and verified with packaging/minisign.pub,
#   SHA256SUMS, attestations, and the Release (draft and, finally, published,
#   which is when the v<versión> tag is created).
# No input is interpolated into scripts: everything is passed through variables.
name: Publicar versión

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publicar-version
  cancel-in-progress: false

jobs:
  preparar:
    name: Preparar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Versión 0.x.y, sin etiqueta y con el CI en verde
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          version=$(sh scripts/version-publicable.sh)
          if gh api "repos/$REPO/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "La etiqueta v$version ya existe: sube la versión en una PR." >&2
            exit 1
          fi
          # Launched right after merging, the commit's CI may still be running
          # (or not have started yet): wait for it rather than fail.
          deadline=$(( $(date +%s) + 2400 ))
          for check in Cambios Verificar Fugas; do
            while :; do
              runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=$check" \
                --jq '[([.check_runs[] | select(.conclusion == "success")] | length),
                       ([.check_runs[] | select(.status != "completed")] | length),
                       (.check_runs | length)] | @tsv')
              passed=$(printf '%s' "$runs" | cut -f1)
              running=$(printf '%s' "$runs" | cut -f2)
              total=$(printf '%s' "$runs" | cut -f3)
              [ "$passed" -ge 1 ] && break
              if { [ "$running" -ge 1 ] || [ "$total" -eq 0 ]; } && [ "$(date +%s)" -lt "$deadline" ]; then
                echo "El check $check del commit $SHA aún no ha terminado; espero."
                sleep 30
                continue
              fi
              echo "El check $check del commit $SHA no terminó en verde." >&2
              exit 1
            done
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux
    needs: preparar
    # glibc 2.35: runs on distributions older than the user's.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preparar.outputs.sha }}
      - name: Librerías del sistema para GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libwayland-dev libfontconfig-dev libfreetype-dev
      - name: Compilar en release
        run: cargo build --release --locked --workspace
      - name: Empaquetar y probar la instalación
        env:
          VERSION: ${{ needs.preparar.outputs.version }}
        run: |
          tarball=$(sh packaging/package.sh "$VERSION" linux-x86_64 target/release dist)
          sh scripts/probar-instalacion.sh "$tarball"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (experimental)
    needs: preparar
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preparar.outputs.sha }}
      - name: Compilar en release
        run: cargo build --release --locked --workspace
      - name: Empaquetar el zip portable
        shell: pwsh
        env:
          VERSION: ${{ needs.preparar.outputs.version }}
        run: |
          $name = "titan-agent-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$name/bin" | Out-Null
          foreach ($b in "titan-agent", "titan-agentd", "titan-team", "titan-agent-launcher") {
            Copy-Item "target/release/$b.exe" "dist/$name/bin/"
          }
          Copy-Item packaging/LEEME.txt "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  publicar:
    name: Publicar
    needs: [preparar, linux, windows]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preparar.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Instalar minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          # With a disposable key: sign with the passphrase via standard input,
          # as below, before touching the real key.
          cd "$RUNNER_TEMP"
          printf 'prueba\nprueba\n' | minisign -G -p prueba.pub -s prueba.key >/dev/null
          echo '{}' > prueba.json
          printf 'prueba\n' | minisign -S -s prueba.key -m prueba.json -t prueba >/dev/null
          minisign -V -p prueba.pub -m prueba.json >/dev/null
          rm -f prueba.*
      - name: Manifiesto firmado y SHA256SUMS
        env:
          VERSION: ${{ needs.preparar.outputs.version }}
          TITAN_AGENT_UPDATE_KEY: ${{ secrets.TITAN_AGENT_UPDATE_KEY }}
          TITAN_AGENT_UPDATE_KEY_PASSWORD: ${{ secrets.TITAN_AGENT_UPDATE_KEY_PASSWORD }}
        run: |
          set -eu
          sh packaging/manifest.sh "$VERSION" dist >/dev/null
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$TITAN_AGENT_UPDATE_KEY" > "$key"
          printf '%s\n' "$TITAN_AGENT_UPDATE_KEY_PASSWORD" | minisign -S -s "$key" \
            -m dist/titan-agent-update.json \
            -t "titan-agent-update format=1 version=$VERSION"
          rm -f "$key"
          # Nothing is uploaded unless the signature verifies with the repo's public key.
          minisign -V -p packaging/minisign.pub -m dist/titan-agent-update.json
          (cd dist && sha256sum *.tar.gz *.zip titan-agent-update.json > SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Crear la Release (borrador) y publicarla
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preparar.outputs.version }}
          SHA: ${{ needs.preparar.outputs.sha }}
        run: |
          set -eu
          gh release create "v$VERSION" --draft --target "$SHA" --generate-notes \
            --title "titan-agent $VERSION" \
            dist/*.tar.gz dist/*.zip dist/titan-agent-update.json \
            dist/titan-agent-update.json.minisig dist/SHA256SUMS
          gh release edit "v$VERSION" --draft=false --latest
